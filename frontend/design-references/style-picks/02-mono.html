<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>02 · 极简黑白</title>
  <style>
    :root {
      --bg-canvas: #ececec;
      --bg-page: #fafafa;
      --bg-card: #fff;
      --bg-muted: #f0f0f0;
      --text-1: #171717;
      --text-2: #525252;
      --text-3: #a3a3a3;
      --brand: #171717;
      --brand-deep: #000;
      --brand-light: #404040;
      --brand-soft: rgba(0,0,0,.05);
      --danger: #dc2626;
      --danger-soft: #fef2f2;
      --sep: rgba(0,0,0,.08);
      --shadow: none;
      --cover: linear-gradient(145deg, #e5e5e5, #a3a3a3);
      --radius: 12px;
      --font: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--font); background: var(--bg-canvas); color: var(--text-1); }
    .wrap { min-height: 100dvh; display: flex; justify-content: center; padding: 12px 0; }
    .phone {
      width: 100%; max-width: 390px; min-height: 100dvh; max-height: 100dvh;
      background: var(--bg-page); display: flex; flex-direction: column;
      border-left: 1px solid var(--sep); border-right: 1px solid var(--sep);
      position: relative; overflow: hidden;
    }
    .tag {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      z-index: 5; font-size: 11px; font-weight: 700; color: var(--text-2);
      background: var(--bg-muted); padding: 4px 12px; border-radius: 999px;
      border: 1px solid var(--sep);
    }
    .back { position: fixed; top: 12px; left: 12px; font-size: 13px; color: var(--text-2); z-index: 20; }
    .panels { flex: 1; min-height: 0; overflow: hidden; padding-bottom: 58px; }
    .panel { display: none; height: 100%; overflow-y: auto; padding: 36px 16px 16px; }
    .panel.active { display: block; }
    .card {
      background: var(--bg-card); border: 1px solid var(--sep);
      border-radius: var(--radius); margin-bottom: 12px;
    }
    .story-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; padding: 14px 14px 0; }
    .story-title { margin: 0; font-size: 16px; font-weight: 700; line-height: 1.3; flex: 1; }
    .btn-del {
      border: 1px solid var(--sep); background: transparent; color: var(--text-2);
      font-size: 11px; font-weight: 600; padding: 5px 10px; border-radius: 6px; cursor: pointer;
    }
    .story-cover {
      display: block; width: calc(100% - 28px); margin: 12px 14px 14px;
      border: none; border-radius: 8px; aspect-ratio: 16/9; max-height: 160px;
      background: var(--cover); position: relative; cursor: pointer;
    }
    .story-cover span {
      position: absolute; left: 10px; bottom: 10px; padding: 5px 11px;
      border-radius: 6px; font-size: 12px; font-weight: 600; color: #fff;
      background: var(--brand);
    }
    .story-new {
      width: 100%; min-height: 100px; border: 1px dashed #d4d4d4;
      background: var(--bg-card); border-radius: var(--radius); cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      color: var(--text-2); font-family: inherit;
    }
    .story-new b { color: var(--text-1); font-size: 15px; font-weight: 600; }
    .story-new small { font-size: 12px; }
    .profile { display: flex; align-items: center; gap: 14px; padding: 18px 16px; }
    .avatar {
      width: 52px; height: 52px; border-radius: 999px; display: grid; place-items: center;
      font-weight: 700; color: #fff; font-size: 20px; background: var(--brand);
    }
    .profile h2 { margin: 0; font-size: 17px; font-weight: 700; }
    .profile p { margin: 4px 0 0; font-size: 13px; color: var(--text-2); }
    .group-label { margin: 0 0 8px 4px; font-size: 11px; font-weight: 600; color: var(--text-3); }
    .row {
      display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 16px;
      border: none; background: transparent; font: inherit; text-align: left; cursor: pointer;
      border-bottom: 1px solid var(--sep);
    }
    .row:last-child { border-bottom: none; }
    .row-icon {
      width: 30px; height: 30px; border-radius: 6px; display: grid; place-items: center;
      background: var(--bg-muted); color: var(--text-2); font-size: 14px;
      border: 1px solid var(--sep);
    }
    .row-label { flex: 1; font-size: 15px; font-weight: 500; }
    .row-val { font-size: 14px; color: var(--text-2); }
    .row-arrow { color: var(--text-3); }
    .logout {
      display: block; width: 100%; margin-top: 8px; padding: 14px; border: none;
      background: transparent; color: var(--danger); font-size: 15px; font-weight: 600;
      font-family: inherit; cursor: pointer;
    }
    .tabbar {
      position: absolute; bottom: 0; left: 0; right: 0; height: 58px;
      display: flex; background: #fff; border-top: 1px solid var(--sep);
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
    .tab-btn {
      flex: 1; border: none; background: transparent; font-family: inherit;
      font-size: 11px; font-weight: 500; color: var(--text-3); padding: 8px 4px; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
    }
    .tab-btn.active { color: var(--brand); font-weight: 700; }
    .tab-btn svg { opacity: .5; }
    .tab-btn.active svg { opacity: 1; }
  </style>
</head>
<body>
  <a class="back" href="index.html">← 四种对比</a>
  <div class="wrap">
    <div class="phone">
      <span class="tag">02 · 极简黑白</span>
      <div class="panels">
        <section class="panel active" id="story">
          <article class="card">
            <div class="story-head">
              <h3 class="story-title">爷爷的抗战回忆</h3>
              <button type="button" class="btn-del">删除</button>
            </div>
            <button type="button" class="story-cover"><span>进入创作</span></button>
          </article>
          <article class="card">
            <div class="story-head">
              <h3 class="story-title">大学四年的故事</h3>
              <button type="button" class="btn-del">删除</button>
            </div>
            <button type="button" class="story-cover"><span>进入创作</span></button>
          </article>
          <button type="button" class="story-new"><b>+ 新故事</b><small>点击开始创作</small></button>
        </section>
        <section class="panel" id="me">
          <div class="card profile">
            <div class="avatar">80</div>
            <div>
              <h2>138****8000</h2>
              <p>加入于 2025年3月12日</p>
            </div>
          </div>
          <p class="group-label">账号</p>
          <div class="card" style="margin-bottom:16px">
            <button type="button" class="row"><span class="row-icon">📱</span><span class="row-label">手机号</span><span class="row-val">138****8000</span></button>
            <button type="button" class="row"><span class="row-icon">↻</span><span class="row-label">换绑手机号</span><span class="row-arrow">›</span></button>
          </div>
          <p class="group-label">其他</p>
          <div class="card" style="margin-bottom:16px">
            <button type="button" class="row"><span class="row-icon">ℹ</span><span class="row-label">关于 Hello Story</span><span class="row-arrow">›</span></button>
          </div>
          <button type="button" class="logout">退出登录</button>
        </section>
      </div>
      <nav class="tabbar">
        <button type="button" class="tab-btn active" data-panel="story">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          故事
        </button>
        <button type="button" class="tab-btn" data-panel="me">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          我的
        </button>
      </nav>
    </div>
  </div>
  <script>
    document.querySelectorAll(".tab-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
        document.querySelectorAll(".panel").forEach((p) => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById(btn.dataset.panel).classList.add("active");
      });
    });
  </script>
</body>
</html>
