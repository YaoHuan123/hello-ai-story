<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>05 · 冰川浅白</title>
  <style>
    :root {
      --bg-canvas: #e5f4fc;
      --bg-page: #fafcff;
      --bg-card: #fff;
      --bg-muted: #f0f9ff;
      --text-1: #0f172a;
      --text-2: #64748b;
      --text-3: #94a3b8;
      --brand: #0ea5e9;
      --brand-deep: #0284c7;
      --brand-light: #7dd3fc;
      --brand-soft: rgba(14,165,233,.1);
      --danger: #f43f5e;
      --danger-soft: #fff1f2;
      --sep: rgba(14,165,233,.08);
      --shadow: 0 1px 2px rgba(14,165,233,.04), 0 4px 14px -4px rgba(14,165,233,.07);
      --cover: linear-gradient(145deg, #e0f2fe, #7dd3fc 40%, #0ea5e9);
      --radius: 14px;
      --font: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--font); background: var(--bg-canvas); color: var(--text-1); }
    .wrap { min-height: 100dvh; display: flex; justify-content: center; padding: 12px 0; }
    .phone { width: 100%; max-width: 390px; min-height: 100dvh; max-height: 100dvh; background: var(--bg-page); display: flex; flex-direction: column; box-shadow: 0 8px 28px -8px rgba(14,165,233,.12); position: relative; overflow: hidden; }
    .tag { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 5; font-size: 11px; font-weight: 700; color: var(--brand-deep); background: var(--brand-soft); padding: 4px 12px; border-radius: 999px; }
    .back { position: fixed; top: 12px; left: 12px; font-size: 13px; color: var(--brand-deep); z-index: 20; }
    .panels { flex: 1; min-height: 0; overflow: hidden; padding-bottom: 58px; }
    .panel { display: none; height: 100%; overflow-y: auto; padding: 36px 16px 16px; }
    .panel.active { display: block; }
    .card { background: var(--bg-card); border: 1px solid var(--sep); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 12px; }
    .story-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; padding: 14px 14px 0; }
    .story-title { margin: 0; font-size: 17px; font-weight: 700; line-height: 1.3; flex: 1; }
    .btn-del { border: none; background: var(--danger-soft); color: var(--danger); font-size: 11px; font-weight: 700; padding: 6px 10px; border-radius: 8px; cursor: pointer; }
    .story-cover { display: block; width: calc(100% - 28px); margin: 12px 14px 14px; border: none; border-radius: 10px; aspect-ratio: 16/9; max-height: 160px; background: var(--cover); position: relative; cursor: pointer; }
    .story-cover span { position: absolute; left: 10px; bottom: 10px; padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; color: #fff; background: rgba(15,23,42,.45); }
    .story-new { width: 100%; min-height: 100px; border: 1.5px dashed rgba(14,165,233,.3); background: var(--bg-card); border-radius: var(--radius); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--text-2); font-family: inherit; }
    .story-new b { color: var(--text-1); font-size: 15px; }
    .story-new small { font-size: 12px; }
    .profile { display: flex; align-items: center; gap: 14px; padding: 18px 16px; }
    .avatar { width: 52px; height: 52px; border-radius: 999px; display: grid; place-items: center; font-weight: 800; color: #fff; font-size: 20px; background: linear-gradient(145deg, var(--brand-light), var(--brand-deep)); }
    .profile h2 { margin: 0; font-size: 18px; font-weight: 800; }
    .profile p { margin: 4px 0 0; font-size: 13px; color: var(--text-2); }
    .group-label { margin: 0 0 8px 4px; font-size: 11px; font-weight: 600; color: var(--text-3); letter-spacing: .04em; }
    .row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 16px; border: none; background: transparent; font: inherit; text-align: left; cursor: pointer; border-bottom: 1px solid var(--sep); }
    .row:last-child { border-bottom: none; }
    .row-icon { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand-deep); font-size: 14px; }
    .row-label { flex: 1; font-size: 15px; font-weight: 600; }
    .row-val { font-size: 14px; color: var(--text-2); }
    .row-arrow { color: var(--text-3); }
    .logout { display: block; width: 100%; margin-top: 8px; padding: 14px; border: none; background: transparent; color: var(--danger); font-size: 16px; font-weight: 600; font-family: inherit; cursor: pointer; }
    .tabbar { position: absolute; bottom: 0; left: 0; right: 0; height: 58px; display: flex; background: rgba(255,255,255,.96); backdrop-filter: blur(12px); border-top: 1px solid var(--sep); padding-bottom: env(safe-area-inset-bottom, 0); }
    .tab-btn { flex: 1; border: none; background: transparent; font-family: inherit; font-size: 11px; font-weight: 600; color: var(--text-3); padding: 8px 4px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .tab-btn.active { color: var(--brand-deep); font-weight: 700; }
    .tab-btn svg { opacity: .6; }
    .tab-btn.active svg { opacity: 1; }
  </style>
</head>
<body>
  <a class="back" href="index.html">← 对比列表</a>
  <div class="wrap">
    <div class="phone">
      <span class="tag">05 · 冰川浅白（03 更淡）</span>
      <div class="panels">
        <section class="panel active" id="story">
          <article class="card"><div class="story-head"><h3 class="story-title">爷爷的抗战回忆</h3><button type="button" class="btn-del">删除</button></div><button type="button" class="story-cover"><span>进入创作</span></button></article>
          <article class="card"><div class="story-head"><h3 class="story-title">大学四年的故事</h3><button type="button" class="btn-del">删除</button></div><button type="button" class="story-cover"><span>进入创作</span></button></article>
          <button type="button" class="story-new"><b>+ 新故事</b><small>点击开始创作</small></button>
        </section>
        <section class="panel" id="me">
          <div class="card profile"><div class="avatar">80</div><div><h2>138****8000</h2><p>加入于 2025年3月12日</p></div></div>
          <p class="group-label">账号</p>
          <div class="card" style="margin-bottom:16px"><button type="button" class="row"><span class="row-icon">📱</span><span class="row-label">手机号</span><span class="row-val">138****8000</span></button><button type="button" class="row"><span class="row-icon">↻</span><span class="row-label">换绑手机号</span><span class="row-arrow">›</span></button></div>
          <p class="group-label">其他</p>
          <div class="card" style="margin-bottom:16px"><button type="button" class="row"><span class="row-icon">ℹ</span><span class="row-label">关于 Hello Story</span><span class="row-arrow">›</span></button></div>
          <button type="button" class="logout">退出登录</button>
        </section>
      </div>
      <nav class="tabbar">
        <button type="button" class="tab-btn active" data-panel="story"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>故事</button>
        <button type="button" class="tab-btn" data-panel="me"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>我的</button>
      </nav>
    </div>
  </div>
  <script>document.querySelectorAll(".tab-btn").forEach((btn)=>{btn.addEventListener("click",()=>{document.querySelectorAll(".tab-btn").forEach((b)=>b.classList.remove("active"));document.querySelectorAll(".panel").forEach((p)=>p.classList.remove("active"));btn.classList.add("active");document.getElementById(btn.dataset.panel).classList.add("active");});});</script>
</body>
</html>
