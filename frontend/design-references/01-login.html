<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>参考 · 登录</title>
  <link rel="stylesheet" href="_shared.css" />
  <style>
    .login-shell {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 20px;
      background: var(--shell-bg-grouped);
      padding: calc(24px + env(safe-area-inset-top, 0px)) 22px calc(32px + env(safe-area-inset-bottom, 0px));
    }
    .login-hero { text-align: center; padding: 8px 12px 0; }
    .login-hero__mark {
      width: 56px; height: 56px; margin: 0 auto 14px;
      border-radius: 16px; background: var(--shell-brand-soft); color: var(--shell-brand);
      display: grid; place-items: center; box-shadow: var(--shell-shadow-card);
    }
    .login-title { margin: 0 0 8px; font-size: 32px; font-weight: 800; letter-spacing: -0.8px; }
    .login-tagline { margin: 0 0 10px; font-size: 16px; color: var(--shell-label-2); line-height: 1.45; }
    .login-steps { margin: 0; font-size: 13px; color: var(--shell-label-3); }
    .login-card {
      background: var(--shell-bg-elevated);
      border-radius: var(--shell-radius-lg);
      border: 1px solid var(--shell-separator);
      padding: 20px 18px;
      box-shadow: var(--shell-shadow-card);
      display: grid;
      gap: 14px;
    }
    .login-card h2 { margin: 0; font-size: 17px; font-weight: 800; }
    .login-hint { margin: -6px 0 0; font-size: 12px; color: var(--shell-label-3); }
    .login-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .login-actions .hs-btn--primary { grid-column: 1 / -1; }
    .ref-back { position: fixed; top: 12px; left: 12px; font-size: 13px; z-index: 10; }
  </style>
</head>
<body>
  <a class="ref-back" href="index.html">← 索引</a>
  <div class="login-shell">
    <div class="login-hero">
      <div class="login-hero__mark" aria-hidden>
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      </div>
      <h1 class="login-title">Hello Story</h1>
      <p class="login-tagline">把访谈变成属于你的故事视频</p>
      <p class="login-steps">聊天采集 · 整理成文 · 一键成片</p>
    </div>

    <div class="login-card">
      <h2>手机号登录</h2>
      <p class="login-hint">短信模式：开发 mock（验证码 123456）</p>
      <label class="ref-field">
        <span class="ref-field__label">手机号</span>
        <input type="tel" placeholder="例如 13800138000" value="13800138000" />
      </label>
      <label class="ref-field">
        <span class="ref-field__label">验证码</span>
        <input type="text" placeholder="6 位数字" value="123456" />
      </label>
      <div class="login-actions">
        <button type="button" class="hs-btn hs-btn--secondary">发送验证码</button>
        <button type="button" class="hs-btn hs-btn--primary">进入故事</button>
      </div>
    </div>
  </div>
</body>
</html>
