# Hello Story iOS — Codemagic (ios branch)
#
# Code signing（Codemagic → Code signing identities → Reference name 须与下列一致）：
#   Provisioning profile: hellostory-appstore  (App Store Distribution)
#   Certificate:          app-common
#
# App ID 须开启 Sign in with Apple；描述文件须含 Sign in with Apple entitlement。
#
# Team ID: TCPBS85F56
# Bundle ID: io.github.com.YaoHuan123.hello-ai-story

workflows:
  hellostory-ios-appstore:
    name: Hello Story iOS App Store
    max_build_duration: 90
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        provisioning_profiles:
          - hellostory-appstore
        certificates:
          - app-common
      vars:
        BUNDLE_ID: io.github.com.YaoHuan123.hello-ai-story
        XCODE_SCHEME: App
        XCODE_PROJECT_DIR: frontend/ios/App
        # 美区生产 API（服务器 Nginx 就绪后生效）
        VITE_API_BASE_URL: "https://hellotita.top/hello-story/api"
        VITE_LOCALE: "en"
        VITE_APPLE_BUNDLE_ID: io.github.com.YaoHuan123.hello-ai-story
      node: 22
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: ios
          include: true

    cache:
      cache_paths:
        - $CM_BUILD_DIR/frontend/node_modules

    scripts:
      - name: Install frontend dependencies
        script: |
          set -e
          cd frontend
          npm ci

      - name: Build bundled native app and sync iOS
        script: |
          set -e
          cd frontend
          cat > .env.ios <<EOF
          VITE_API_BASE_URL=${VITE_API_BASE_URL}
          VITE_LOCALE=${VITE_LOCALE}
          VITE_ENABLE_QUIZ_REWARDS=0
          EOF
          echo "=== .env.ios ==="
          cat .env.ios
          npm run ios
          echo "=== Bundled app (no remote server.url) ==="
          cat ios/App/App/capacitor.config.json

      - name: Install CocoaPods
        script: |
          set -e
          cd "$CM_BUILD_DIR/$XCODE_PROJECT_DIR"
          pod install

      - name: Set up code signing on Xcode project
        script: xcode-project use-profiles

      - name: Build App Store IPA
        script: |
          set -e
          cd "$CM_BUILD_DIR/$XCODE_PROJECT_DIR"
          xcode-project build-ipa \
            --workspace "App.xcworkspace" \
            --scheme "$XCODE_SCHEME"
          ls -la build/ios/ipa/

    artifacts:
      - frontend/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    # 上传 TestFlight（在 Codemagic UI 配置 App Store Connect API key 后取消注释并填 issuer/key/id）
