# Hello Story iOS — Codemagic App Store
# App: hello-story  |  布局: frontend  |  由上线助手生成

workflows:
  hello-story-ios-appstore:
    name: hello-story iOS App Store

    max_build_duration: 90
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: huanqi-asc

    environment:
      ios_signing:
        provisioning_profiles:
          - hellostory-appstore
        certificates:
          - app-common
      vars:
        BUNDLE_ID: io.github.com.YaoHuan123.hello-ai-story
        VITE_API_BASE_URL: "https://hellotita.top/hello-story/api"
        XCODE_SCHEME: App
        XCODE_PROJECT_DIR: frontend/ios/App
        VITE_APPLE_BUNDLE_ID: io.github.com.YaoHuan123.hello-ai-story
      node: 22
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: ios
          include: true

    cache:
      cache_paths:
        - $CM_BUILD_DIR/frontend/node_modules

    scripts:
      - name: Install frontend dependencies
        script: |
          set -e
          cd frontend
          npm ci

      - name: Build bundled native app and sync iOS
        script: |
          set -e
          cd frontend
          cat > .env.ios <<EOF
          VITE_API_BASE_URL=${VITE_API_BASE_URL}
          VITE_LOCALE=en
          VITE_ENABLE_QUIZ_REWARDS=0
          EOF
          export CAPACITOR_PLATFORM=ios
          export VITE_APPLE_BUNDLE_ID="$BUNDLE_ID"
          npm run ios
          echo "=== Bundled app ==="
          cat ios/App/App/capacitor.config.json

      - name: Install CocoaPods
        script: |
          set -e
          cd "$CM_BUILD_DIR/$XCODE_PROJECT_DIR"
          pod install

      - name: Set up code signing on Xcode project
        script: |
          set -e
          xcode-project use-profiles
          if [ ! -f "$HOME/export_options.plist" ]; then
            echo "export_options.plist not generated by use-profiles" >&2
            exit 1
          fi
          if /usr/libexec/PlistBuddy -c "Print :method" "$HOME/export_options.plist" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c "Set :method app-store" "$HOME/export_options.plist"
          else
            /usr/libexec/PlistBuddy -c "Add :method string app-store" "$HOME/export_options.plist"
          fi

      - name: Build App Store IPA
        script: |
          set -e
          cd "$CM_BUILD_DIR/$XCODE_PROJECT_DIR"
          xcode-project build-ipa \
            --workspace "App.xcworkspace" \
            --scheme "$XCODE_SCHEME" \
            --export-options-plist "$HOME/export_options.plist"
          ls -la build/ios/ipa/

    artifacts:
      - frontend/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
