# Hello Story iOS — Codemagic (ios branch)
#
# Native app: UI bundled in IPA, API at VITE_API_BASE_URL
# Codemagic → Code signing identities → Reference name: hellostory-hoc (profile + cert)
#
# Team ID: TCPBS85F56
# Bundle ID: io.github.com.YaoHuan123.hello-ai-story

workflows:
  hellostory-ios-adhoc:
    name: Hello Story iOS Ad Hoc
    max_build_duration: 90
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        provisioning_profiles:
          - hellostory-hoc
        certificates:
          - hellostory-hoc
      vars:
        BUNDLE_ID: io.github.com.YaoHuan123.hello-ai-story
        XCODE_SCHEME: App
        XCODE_PROJECT_DIR: frontend/ios/App
        VITE_API_BASE_URL: "http://192.168.137.1:3001"
        VITE_APPLE_BUNDLE_ID: io.github.com.YaoHuan123.hello-ai-story
      node: 22
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: ios
          include: true

    cache:
      cache_paths:
        - $CM_BUILD_DIR/frontend/node_modules

    scripts:
      - name: Install frontend dependencies
        script: |
          set -e
          cd frontend
          npm ci

      - name: Build bundled native app and sync iOS
        script: |
          set -e
          cd frontend
          cat > .env.ios <<EOF
          VITE_API_BASE_URL=${VITE_API_BASE_URL}
          EOF
          npm run ios
          echo "=== Bundled app (no remote server.url) ==="
          cat ios/App/App/capacitor.config.json

      - name: Install CocoaPods
        script: |
          set -e
          cd "$CM_BUILD_DIR/$XCODE_PROJECT_DIR"
          pod install

      - name: Set up code signing on Xcode project
        script: xcode-project use-profiles

      - name: Build ad hoc IPA
        script: |
          set -e
          cd "$CM_BUILD_DIR/$XCODE_PROJECT_DIR"
          xcode-project build-ipa \
            --workspace "App.xcworkspace" \
            --scheme "$XCODE_SCHEME"
          ls -la build/ios/ipa/

    artifacts:
      - frontend/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
