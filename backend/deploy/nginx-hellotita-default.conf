server {
    listen 80;
    server_name hellotita.top;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name hellotita.top;
    ssl_certificate /etc/letsencrypt/live/hellotita.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hellotita.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Hello Story API + legal pages (port 3002)
    location /hello-story/api/ {
        proxy_pass http://127.0.0.1:3002/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location ~ ^/hello-story/(privacy|terms|support)$ {
        proxy_pass http://127.0.0.1:3002/$1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hello Story Web SPA（静态 dist；须在 /hello-story/api/ 之后）
    location = /hello-story {
        return 301 /hello-story/;
    }

    location /hello-story/ {
        alias /home/admin/apps/hello-story/frontend/dist/;
        index index.html;
        try_files $uri $uri/ /hello-story/index.html;
    }

    # HuanQi / default site
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
